[package]
name = "quantum_ecc"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "qcat-server-eval"
path = "src/bin/server_eval.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[dependencies]
alloy-primitives = "1.5"
ruint = "1.12"
sha3 = "0.10"
zstd = "0.13"
